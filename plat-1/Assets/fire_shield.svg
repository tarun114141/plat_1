<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shield Plate Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d130a" />
      <stop offset="50%" stop-color="#190906" />
      <stop offset="100%" stop-color="#0c0403" />
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680" />
      <stop offset="30%" stop-color="#ff9900" />
      <stop offset="70%" stop-color="#cc5200" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>

    <!-- Flame Core Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cc1100" />
      <stop offset="40%" stop-color="#ff5500" />
      <stop offset="75%" stop-color="#ffbb00" />
      <stop offset="100%" stop-color="#ffffcc" />
    </linearGradient>
  </defs>

  <!-- Aura Glow Behind Shield -->
  <path d="M64 10 Q106 14 106 48 Q106 88 64 120 Q22 88 22 48 Q22 14 64 10 Z" 
        fill="#ff4400" opacity="0.4" filter="url(#glow)"/>

  <!-- Outer Golden Border -->
  <path d="M64 12 Q104 16 104 48 Q104 86 64 118 Q24 86 24 48 Q24 16 64 12 Z" 
        fill="url(#goldBorder)" stroke="#551a00" stroke-width="2"/>

  <!-- Inner Obsidian Shield Body -->
  <path d="M64 18 Q98 22 98 48 Q98 82 64 112 Q30 82 30 48 Q30 22 64 18 Z" 
        fill="url(#shieldGrad)" stroke="#ff7700" stroke-width="1.5"/>

  <!-- Magma Cracks on Shield -->
  <path d="M38 35 Q50 45 46 62 Q42 75 52 88" 
        stroke="#ff4400" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M90 35 Q78 45 82 62 Q86 75 76 88" 
        stroke="#ff4400" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Center Fiery Flame Emblem -->
  <!-- Outer Flame -->
  <path d="M64 30 C72 44 86 52 84 72 C82 92 68 100 64 102 C60 100 46 92 44 72 C42 52 56 44 64 30 Z" 
        fill="url(#flameGrad)" filter="url(#glow)"/>

  <!-- Mid Flame Tongue -->
  <path d="M64 42 C70 52 78 60 76 74 C74 86 66 92 64 94 C62 92 54 86 52 74 C50 60 58 52 64 42 Z" 
        fill="#ffaa00"/>

  <!-- Inner Bright Molten Core -->
  <path d="M64 56 C68 64 72 70 70 78 C68 84 65 88 64 88 C63 88 60 84 58 78 C56 70 60 64 64 56 Z" 
        fill="#ffffe0"/>

  <!-- Shield Top Rivets -->
  <circle cx="42" cy="24" r="3" fill="#ffe066" stroke="#994d00" stroke-width="1"/>
  <circle cx="86" cy="24" r="3" fill="#ffe066" stroke="#994d00" stroke-width="1"/>
  <circle cx="64" cy="18" r="3.5" fill="#ffe066" stroke="#994d00" stroke-width="1"/>
</svg>
